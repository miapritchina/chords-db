name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @practice/web test
      - run: pnpm --filter @practice/web build
        env:
          VITE_BASE: /chords-db/
      # SPA fallback so deep links (e.g. /melodies) work on Pages
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      # Publishing to gh-pages auto-enables Pages for the branch,
      # which the workflow token is allowed to do (unlike the Pages API).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
