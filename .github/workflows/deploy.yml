name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @practice/web test
      - run: pnpm --filter @practice/web build
        env:
          VITE_BASE: /chords-db/
      # SPA fallback so deep links (e.g. /melodies) work on Pages
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      # Publishing to gh-pages auto-enables Pages for the branch,
      # which the workflow token is allowed to do (unlike the Pages API).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
      # Ensure the Pages site serves the gh-pages branch, not master's README.
      # (Updating an existing Pages site only needs pages:write; harmless no-op
      # if it is already correct, warning only if the token can't do it.)
      - name: Point Pages at gh-pages branch
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' \
            -o /tmp/pages.json -w "HTTP %{http_code}\n" || true
          cat /tmp/pages.json || true
